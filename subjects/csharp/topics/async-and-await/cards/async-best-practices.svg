<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Async best practices</title>
  <desc id="desc">Use async all the way, await naturally, pass cancellation tokens, and avoid blocking waits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effaf7"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="32" fill="url(#bg)"/>
  <text x="56" y="78" fill="#16856b" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" letter-spacing="3">C# STUDY CARD</text>
  <text x="56" y="136" fill="#202b3c" font-family="Segoe UI, sans-serif" font-size="42" font-weight="750">Async all the way</text>
  <text x="56" y="184" fill="#526174" font-family="Segoe UI, sans-serif" font-size="20">Keep the asynchronous flow clear from entry point to I/O.</text>
  <g font-family="Segoe UI, sans-serif" font-size="20" font-weight="650">
    <rect x="56" y="228" width="405" height="82" rx="18" fill="#fff" stroke="#b6e7d5" stroke-width="2"/>
    <circle cx="101" cy="269" r="20" fill="#d8f3e9"/>
    <path d="m91 269 7 7 14-16" fill="none" stroke="#16856b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="138" y="276" fill="#202b3c">Await asynchronous operations</text>
    <rect x="499" y="228" width="405" height="82" rx="18" fill="#fff" stroke="#b6e7d5" stroke-width="2"/>
    <circle cx="544" cy="269" r="20" fill="#d8f3e9"/>
    <path d="m534 269 7 7 14-16" fill="none" stroke="#16856b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="581" y="276" fill="#202b3c">Pass CancellationToken through</text>
    <rect x="56" y="334" width="405" height="82" rx="18" fill="#fff" stroke="#b6e7d5" stroke-width="2"/>
    <circle cx="101" cy="375" r="20" fill="#d8f3e9"/>
    <path d="m91 375 7 7 14-16" fill="none" stroke="#16856b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="138" y="382" fill="#202b3c">Return Task / Task&lt;T&gt;</text>
    <rect x="499" y="334" width="405" height="82" rx="18" fill="#fff0ef" stroke="#efc5c1" stroke-width="2"/>
    <circle cx="544" cy="375" r="20" fill="#f9deda"/>
    <path d="m537 368 14 14m0-14-14 14" stroke="#b33e47" stroke-width="4" stroke-linecap="round"/>
    <text x="581" y="382" fill="#8f3038">Avoid .Result and .Wait()</text>
  </g>
  <text x="480" y="486" text-anchor="middle" fill="#526174" font-family="Segoe UI, sans-serif" font-size="18">Async I/O helps threads stay available while work is waiting.</text>
</svg>
