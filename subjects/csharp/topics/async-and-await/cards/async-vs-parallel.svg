<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Async and parallel work</title>
  <desc id="desc">Async frees a thread while waiting for I/O; parallelism runs CPU work at the same time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#eafaf5"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="32" fill="url(#bg)"/>
  <text x="56" y="78" fill="#3269d5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" letter-spacing="3">C# STUDY CARD</text>
  <text x="56" y="136" fill="#202b3c" font-family="Segoe UI, sans-serif" font-size="42" font-weight="750">Async ≠ Parallel</text>
  <rect x="56" y="178" width="408" height="270" rx="22" fill="#fff" stroke="#bfd2f4" stroke-width="2"/>
  <rect x="496" y="178" width="408" height="270" rx="22" fill="#fff" stroke="#b6e7d5" stroke-width="2"/>
  <text x="88" y="226" fill="#3269d5" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">ASYNC I/O</text>
  <text x="88" y="270" fill="#202b3c" font-family="Segoe UI, sans-serif" font-size="20">Wait without blocking a thread</text>
  <rect x="88" y="308" width="126" height="62" rx="14" fill="#eaf0ff"/>
  <text x="151" y="346" text-anchor="middle" fill="#254f9e" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">Request</text>
  <path d="M226 339h66" stroke="#3269d5" stroke-width="5" stroke-linecap="round"/>
  <path d="m281 328 13 11-13 11" fill="none" stroke="#3269d5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="306" y="308" width="126" height="62" rx="14" fill="#eafaf5"/>
  <text x="369" y="346" text-anchor="middle" fill="#16856b" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">I/O wait</text>
  <text x="528" y="226" fill="#16856b" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">PARALLEL CPU</text>
  <text x="528" y="270" fill="#202b3c" font-family="Segoe UI, sans-serif" font-size="20">Run independent work together</text>
  <rect x="528" y="304" width="168" height="52" rx="13" fill="#eaf0ff"/>
  <text x="612" y="337" text-anchor="middle" fill="#254f9e" font-family="Segoe UI, sans-serif" font-size="17" font-weight="650">Worker A</text>
  <rect x="528" y="368" width="168" height="52" rx="13" fill="#eafaf5"/>
  <text x="612" y="401" text-anchor="middle" fill="#16856b" font-family="Segoe UI, sans-serif" font-size="17" font-weight="650">Worker B</text>
  <path d="M709 330h123M709 394h123" stroke="#9aaabd" stroke-width="5" stroke-linecap="round"/>
  <circle cx="851" cy="362" r="20" fill="#f3c36d"/>
  <text x="56" y="504" fill="#526174" font-family="Segoe UI, sans-serif" font-size="19">Async improves responsiveness; parallelism can increase CPU throughput.</text>
</svg>
