<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Async and await flow</title><desc id="desc">The calling thread can handle other work while an asynchronous I/O operation waits.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3269d5"/></marker></defs><rect width="960" height="300" rx="28" fill="#f5f8ff"/><text x="48" y="58" font-family="system-ui" font-size="26" font-weight="700" fill="#203451">Async I/O · simplified</text><g font-family="system-ui" text-anchor="middle"><rect x="60" y="110" width="190" height="90" rx="14" fill="#fff" stroke="#8ba9dd" stroke-width="2"/><text x="155" y="150" font-size="18" font-weight="700" fill="#203451">Call operation</text><text x="155" y="176" font-size="14" fill="#50627a">await request</text><rect x="385" y="110" width="190" height="90" rx="14" fill="#fff3df" stroke="#d7a650" stroke-width="2"/><text x="480" y="150" font-size="18" font-weight="700" fill="#81530e">Wait for I/O</text><text x="480" y="176" font-size="14" fill="#50627a">thread is available</text><rect x="710" y="110" width="190" height="90" rx="14" fill="#e8f5ef" stroke="#73b89a" stroke-width="2"/><text x="805" y="150" font-size="18" font-weight="700" fill="#17624c">Continue</text><text x="805" y="176" font-size="14" fill="#50627a">result is ready</text><path d="M260 155 H370" stroke="#3269d5" stroke-width="4" marker-end="url(#arrow)"/><path d="M585 155 H695" stroke="#3269d5" stroke-width="4" marker-end="url(#arrow)"/></g></svg>