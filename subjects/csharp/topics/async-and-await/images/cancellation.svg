<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Cancellation token propagation</title><desc id="desc">A cancellation signal flows from the caller through service and repository to the I/O operation.</desc><rect width="960" height="300" rx="28" fill="#f7f8fc"/><text x="48" y="58" font-family="system-ui" font-size="26" font-weight="700" fill="#203451">Cancellation flows down</text><g font-family="system-ui" text-anchor="middle"><g fill="#fff" stroke="#8ba9dd" stroke-width="2"><rect x="50" y="112" width="180" height="78" rx="14"/><rect x="285" y="112" width="180" height="78" rx="14"/><rect x="520" y="112" width="180" height="78" rx="14"/><rect x="755" y="112" width="155" height="78" rx="14"/></g><text x="140" y="158" font-size="17" fill="#203451">Caller</text><text x="375" y="158" font-size="17" fill="#203451">API service</text><text x="610" y="158" font-size="17" fill="#203451">Repository</text><text x="832" y="158" font-size="17" fill="#203451">I/O</text><g stroke="#3269d5" stroke-width="3"><path d="M235 151h42"/><path d="M470 151h42"/><path d="M705 151h42"/></g><g fill="#3269d5"><path d="M277 145l10 6-10 6z"/><path d="M512 145l10 6-10 6z"/><path d="M747 145l10 6-10 6z"/></g><text x="480" y="238" font-size="15" fill="#68778a">Pass the token through every cancellable call.</text></g></svg>