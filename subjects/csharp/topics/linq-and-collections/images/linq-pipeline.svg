<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">LINQ query pipeline</title><desc id="desc">A sequence passes through Where and Select, and materializes at ToArray.</desc><rect width="960" height="300" rx="28" fill="#f6f8fc"/><text x="48" y="58" font-family="system-ui" font-size="26" font-weight="700" fill="#203451">LINQ query pipeline</text><g font-family="system-ui" text-anchor="middle"><g fill="#fff" stroke="#8ba9dd" stroke-width="2"><rect x="55" y="116" width="175" height="76" rx="14"/><rect x="285" y="116" width="175" height="76" rx="14"/><rect x="515" y="116" width="175" height="76" rx="14"/><rect x="745" y="116" width="160" height="76" rx="14"/></g><text x="142" y="161" font-size="18" fill="#203451">Source</text><text x="372" y="161" font-size="18" fill="#203451">Where</text><text x="602" y="161" font-size="18" fill="#203451">Select</text><text x="825" y="161" font-size="18" fill="#203451">ToArray</text><g stroke="#3269d5" stroke-width="3"><path d="M235 154h40"/><path d="M465 154h40"/><path d="M695 154h40"/></g><g fill="#3269d5"><path d="M275 148l10 6-10 6z"/><path d="M505 148l10 6-10 6z"/><path d="M735 148l10 6-10 6z"/></g><text x="480" y="240" font-size="15" fill="#68778a">Deferred operators execute when the sequence is enumerated.</text></g></svg>