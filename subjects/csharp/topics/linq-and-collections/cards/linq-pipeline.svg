<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">LINQ query pipeline</title>
  <desc id="desc">A LINQ query flows from a source through Where and Select, then materializes at ToArray.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#f6f1ff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="32" fill="url(#bg)"/>
  <text x="56" y="78" fill="#3269d5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" letter-spacing="3">C# STUDY CARD</text>
  <text x="56" y="136" fill="#202b3c" font-family="Segoe UI, sans-serif" font-size="42" font-weight="750">Think in LINQ stages</text>
  <text x="56" y="184" fill="#526174" font-family="Segoe UI, sans-serif" font-size="20">Queries are often deferred until they are enumerated.</text>
  <g font-family="Segoe UI, sans-serif">
    <rect x="54" y="250" width="184" height="112" rx="20" fill="#fff" stroke="#bfd2f4" stroke-width="2"/>
    <text x="146" y="293" text-anchor="middle" fill="#254f9e" font-size="16" font-weight="700">SOURCE</text>
    <text x="146" y="331" text-anchor="middle" fill="#202b3c" font-size="21">customers</text>
    <path d="M246 306h48" stroke="#3269d5" stroke-width="5" stroke-linecap="round"/>
    <path d="m282 295 13 11-13 11" fill="none" stroke="#3269d5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="308" y="250" width="184" height="112" rx="20" fill="#fff" stroke="#b6e7d5" stroke-width="2"/>
    <text x="400" y="293" text-anchor="middle" fill="#16856b" font-size="16" font-weight="700">FILTER</text>
    <text x="400" y="331" text-anchor="middle" fill="#202b3c" font-size="21">Where(active)</text>
    <path d="M500 306h48" stroke="#3269d5" stroke-width="5" stroke-linecap="round"/>
    <path d="m536 295 13 11-13 11" fill="none" stroke="#3269d5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="562" y="250" width="184" height="112" rx="20" fill="#fff" stroke="#d8c9f3" stroke-width="2"/>
    <text x="654" y="293" text-anchor="middle" fill="#7855b7" font-size="16" font-weight="700">PROJECT</text>
    <text x="654" y="331" text-anchor="middle" fill="#202b3c" font-size="21">Select(name)</text>
    <path d="M754 306h48" stroke="#3269d5" stroke-width="5" stroke-linecap="round"/>
    <path d="m790 295 13 11-13 11" fill="none" stroke="#3269d5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="816" y="250" width="100" height="112" rx="20" fill="#eaf0ff"/>
    <text x="866" y="293" text-anchor="middle" fill="#254f9e" font-size="14" font-weight="700">EXECUTE</text>
    <text x="866" y="331" text-anchor="middle" fill="#202b3c" font-size="20">ToArray</text>
  </g>
  <rect x="56" y="410" width="848" height="58" rx="16" fill="#fff" opacity=".8"/>
  <text x="480" y="447" text-anchor="middle" fill="#526174" font-family="Segoe UI, sans-serif" font-size="18">Materialize intentionally when you need a stable result or execution boundary.</text>
</svg>
