<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Object-oriented programming pillars</title><desc id="desc">Abstraction, encapsulation, inheritance, and polymorphism.</desc><rect width="960" height="360" rx="28" fill="#f5f7fa"/><text x="48" y="62" font-family="system-ui" font-size="27" font-weight="700" fill="#203451">Four OOP concepts</text><g font-family="system-ui" text-anchor="middle"><g><rect x="42" y="110" width="205" height="190" rx="18" fill="#e9f0ff" stroke="#7c9fe0" stroke-width="2"/><text x="144" y="175" font-size="21" font-weight="700" fill="#24477f">Abstraction</text><text x="144" y="215" font-size="15" fill="#50627a">Expose what matters</text></g><g><rect x="276" y="110" width="205" height="190" rx="18" fill="#e8f5ef" stroke="#73b89a" stroke-width="2"/><text x="378" y="175" font-size="21" font-weight="700" fill="#17624c">Encapsulation</text><text x="378" y="215" font-size="15" fill="#50627a">Protect invariants</text></g><g><rect x="510" y="110" width="205" height="190" rx="18" fill="#fff3df" stroke="#d7a650" stroke-width="2"/><text x="612" y="175" font-size="21" font-weight="700" fill="#81530e">Inheritance</text><text x="612" y="215" font-size="15" fill="#50627a">Reuse a true subtype</text></g><g><rect x="744" y="110" width="175" height="190" rx="18" fill="#f3eafa" stroke="#b28bc9" stroke-width="2"/><text x="831" y="175" font-size="20" font-weight="700" fill="#67417c">Polymorphism</text><text x="831" y="215" font-size="14" fill="#50627a">Vary behavior</text></g></g></svg>