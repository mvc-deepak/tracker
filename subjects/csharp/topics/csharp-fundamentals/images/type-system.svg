<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">C# type system overview</title><desc id="desc">Value types and reference types with common examples.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eff4ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient><style>.t{font:700 25px system-ui;fill:#203451}.s{font:500 17px system-ui;fill:#50627a}.card{fill:#fff;stroke:#cbd8eb;stroke-width:2}.accent{fill:#e9f0ff;stroke:#6590dd;stroke-width:2}</style></defs><rect width="960" height="460" rx="28" fill="url(#bg)"/><text class="t" x="50" y="60">C# Type System · quick map</text><rect class="accent" x="55" y="105" width="400" height="285" rx="20"/><text class="t" x="88" y="155">Value types</text><text class="s" x="88" y="190">Values are copied when assigned</text><rect class="card" x="88" y="222" width="145" height="68" rx="12"/><text class="s" x="116" y="264">struct</text><rect class="card" x="255" y="222" width="145" height="68" rx="12"/><text class="s" x="283" y="264">enum</text><text class="s" x="88" y="335">int · bool · DateTime · record struct</text><rect class="accent" x="505" y="105" width="400" height="285" rx="20"/><text class="t" x="538" y="155">Reference types</text><text class="s" x="538" y="190">Variables refer to objects</text><rect class="card" x="538" y="222" width="145" height="68" rx="12"/><text class="s" x="584" y="264">class</text><rect class="card" x="705" y="222" width="145" height="68" rx="12"/><text class="s" x="731" y="264">interface</text><text class="s" x="538" y="335">string · arrays · delegates · records</text></svg>