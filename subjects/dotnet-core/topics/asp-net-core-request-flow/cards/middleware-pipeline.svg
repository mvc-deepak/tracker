<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">ASP.NET Core middleware pipeline</title>
  <desc id="desc">Requests pass through middleware in order to an endpoint; responses unwind in reverse order.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#effaf7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="32" fill="url(#bg)"/>
  <text x="56" y="78" fill="#3269d5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" letter-spacing="3">.NET STUDY CARD</text>
  <text x="56" y="136" fill="#202b3c" font-family="Segoe UI, sans-serif" font-size="40" font-weight="750">Middleware runs in order</text>
  <text x="56" y="184" fill="#526174" font-family="Segoe UI, sans-serif" font-size="20">Each component can handle the request or pass it onward.</text>
  <g font-family="Segoe UI, sans-serif">
    <rect x="52" y="244" width="142" height="94" rx="18" fill="#fff" stroke="#bfd2f4" stroke-width="2"/>
    <text x="123" y="300" text-anchor="middle" fill="#254f9e" font-size="18" font-weight="700">REQUEST</text>
    <path d="M198 291h34" stroke="#3269d5" stroke-width="5" stroke-linecap="round"/>
    <path d="m222 280 13 11-13 11" fill="none" stroke="#3269d5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="246" y="244" width="154" height="94" rx="18" fill="#eaf0ff"/>
    <text x="323" y="283" text-anchor="middle" fill="#254f9e" font-size="16" font-weight="700">Exception</text>
    <text x="323" y="308" text-anchor="middle" fill="#254f9e" font-size="16">handling</text>
    <path d="M404 291h34" stroke="#3269d5" stroke-width="5" stroke-linecap="round"/>
    <path d="m428 280 13 11-13 11" fill="none" stroke="#3269d5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="452" y="244" width="140" height="94" rx="18" fill="#eafaf5"/>
    <text x="522" y="300" text-anchor="middle" fill="#16856b" font-size="17" font-weight="700">Routing</text>
    <path d="M596 291h34" stroke="#3269d5" stroke-width="5" stroke-linecap="round"/>
    <path d="m620 280 13 11-13 11" fill="none" stroke="#3269d5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="644" y="244" width="142" height="94" rx="18" fill="#fff2d9"/>
    <text x="715" y="300" text-anchor="middle" fill="#875700" font-size="17" font-weight="700">Auth</text>
    <path d="M790 291h34" stroke="#3269d5" stroke-width="5" stroke-linecap="round"/>
    <path d="m814 280 13 11-13 11" fill="none" stroke="#3269d5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="838" y="244" width="100" height="94" rx="18" fill="#fff" stroke="#b6e7d5" stroke-width="2"/>
    <text x="888" y="300" text-anchor="middle" fill="#16856b" font-size="16" font-weight="700">ENDPOINT</text>
  </g>
  <path d="M885 370v50H320v-42" fill="none" stroke="#16856b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 9"/>
  <path d="m309 385 11-13 11 13" fill="none" stroke="#16856b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="466" text-anchor="middle" fill="#16856b" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">Response unwinds through middleware in reverse order</text>
</svg>
